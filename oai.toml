# OAI provider configuration.
#
# Mapping is data, not code: point these XPaths at any XML source.
# XPaths are relative to the record element, or absolute if they start with /.

[identity]
repositoryName = "Museum collection (OAI provider recreation)"
baseURL = "http://localhost:8000/oai"
adminEmail = "mauricemengel@gmail.com"
earliestDatestamp = "1970-01-01T00:00:00Z"
granularity = "YYYY-MM-DDThh:mm:ssZ"
# Our dump has no delete signal, so absence from a full dump is the signal and
# reconciling can emit real tombstones. "persistent" is therefore achievable
# and is the only setting a harvester can never be misled by.
deletedRecord = "persistent"
description = "Zetcom MuseumPlus RIA XML, enveloped per moduleItem."

[basex]
url = "http://localhost:8080/rest"
database = "riadb"
user = "oai"
# DEV PLACEHOLDER. Prefer the OAI_BASEX_PASSWORD environment variable; this
# key exists only so the repo is runnable out of the box. Move it before
# anything is exposed.
password = "devpass"
timeout = 120

[mapping]
namespaces = { m = "http://www.zetcom.com/ria/ws/module" }

records = "/m:application/m:modules/m:module[@name='Object']/m:moduleItem"

# uuid is broken in our MuseumPlus instance, so the integer @id is the key.
# It is also what the old MPX provider used (objId).
identifier = "@id"
identifierPrefix = "spk-berlin.de:EM-objId-"

# __lastModified is the record's own modification time - the thing MPX never
# had, and the reason the old provider fell back to the export date.
datestamp = "m:systemField[@name='__lastModified']/m:value"

# Source timestamps are local wall clock, space-separated, no zone.
# They must be shifted to UTC, not merely labelled "Z".
timezoneOffset = "+02:00"

# Sets are an explicit allow-list: only what is named here is exposed, and
# the setSpec is a label we choose - never a value taken out of a record.
# A record is in the set when its XPath selects anything. Internal group ids
# and organisational units therefore cannot reach OAI output by accident,
# and an internal group that is not listed is not harvestable at all.
#
# __orgUnit is an organisational unit, not a set, and must not be published
# as one. The group ids below are from the synthetic sample file.

[[mapping.sets]]
spec = "mimo"
label = "Musikinstrumente"
xpath = "m:moduleReference[@name='ObjObjectGroupsRef']/m:moduleReferenceItem[@moduleItemId='6054']"

[[mapping.sets]]
spec = "78"
label = "Schellackplatten"
xpath = "m:moduleReference[@name='ObjObjectGroupsRef']/m:moduleReferenceItem[@moduleItemId='78']"

# Value tests belong inside the XPath, e.g.:
#   xpath = "m:dataField[@name='ObjekttypTxt'][m:value='Musikinstrument']"

[protocol]
pageSize = 100
# resumption tokens expire, which is what replaces server-side eviction
tokenTTL = 86400
# DEV PLACEHOLDER. Prefer OAI_TOKEN_SECRET. Without a secret tokens are
# unsigned, so they cannot be trusted to be untampered - fine for local
# development, not for exposure.
tokenSecret = "dev-token-secret-change-me"

# Metadata formats to advertise. Only "passthrough" is implemented: the
# stored payload is served verbatim inside <metadata>, which is why the
# metadata namespace is Zetcom's.
#
# NOTE: no oai_dc. Deriving Dublin Core would need a field-by-field mapping
# (title, creator, date, rights ...) and that decision has not been made yet.
[[metadata.formats]]
prefix = "ria"
namespace = "http://www.zetcom.com/ria/ws/module"
schema = ""
kind = "passthrough"
