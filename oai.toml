# OAI provider configuration.
#
# Mapping is data, not code: point these XPaths at any XML source.
# XPaths are relative to the record element, or absolute if they start with /.

[identity]
repositoryName = "Museum collection (OAI provider recreation)"
baseURL = "http://localhost:8000/oai"
adminEmail = "mauricemengel@gmail.com"
earliestDatestamp = "1970-01-01T00:00:00Z"
granularity = "YYYY-MM-DDThh:mm:ssZ"
# Our dump has no delete signal, so absence from a full dump is the signal and
# reconciling can emit real tombstones. "persistent" is therefore achievable
# and is the only setting a harvester can never be misled by.
deletedRecord = "persistent"
description = "Zetcom MuseumPlus RIA XML, enveloped per moduleItem."

[basex]
url = "http://localhost:8080/rest"
database = "riadb"
user = "oai"
# DEV PLACEHOLDER. Prefer the OAI_BASEX_PASSWORD environment variable; this
# key exists only so the repo is runnable out of the box. Move it before
# anything is exposed.
password = "devpass"
timeout = 120

[mapping]
namespaces = { m = "http://www.zetcom.com/ria/ws/module" }

records = "/m:application/m:modules/m:module[@name='Object']/m:moduleItem"

# uuid is broken in our MuseumPlus instance, so the integer @id is the key.
# It is also what the old MPX provider used (objId).
identifier = "@id"
identifierPrefix = "spk-berlin.de:EM-objId-"

# __lastModified is the record's own modification time - the thing MPX never
# had, and the reason the old provider fell back to the export date.
datestamp = "m:systemField[@name='__lastModified']/m:value"

# Source timestamps are local wall clock, space-separated, no zone.
# They must be shifted to UTC, not merely labelled "Z".
timezoneOffset = "+02:00"

[[mapping.sets]]
name = "orgUnit"
xpath = "m:systemField[@name='__orgUnit']/m:value"

[[mapping.sets]]
name = "objectGroup"
xpath = "m:moduleReference[@name='ObjObjectGroupsRef']/m:moduleReferenceItem/@moduleItemId"
spec = "group-{value}"
