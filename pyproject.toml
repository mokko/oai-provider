[project]
name = "oai-provider"
version = "0.1.0"
description = "OAI-PMH data provider backend with BaseX as the store"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Protocol layer (not yet written):
#   starlette, uvicorn
web = ["starlette>=0.37", "uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
