# OAI provider configuration.
#
# Mapping is data, not code: point these XPaths at any XML source.
# XPaths are relative to the record element, or absolute if they start with /.

[identity]
repositoryName = "Museum collection (OAI provider recreation)"
baseURL = "http://localhost:8000/oai"
# ^ the neutral default. The address this is actually deployed behind comes
# from OAI_BASE_URL - a real environment variable, or `.env` next to this file
# (see `.env.example`). It must be the address a harvester can call back:
# Identify echoes it and harvesters then dial it.
adminEmail = "mauricemengel@gmail.com"
earliestDatestamp = "1970-01-01T00:00:00Z"
granularity = "YYYY-MM-DDThh:mm:ssZ"
# OAI's deletedRecord. The value that can be honoured is the value that is
# true: module ingest is additive and never deletes (and --reset rebuilds a
# database from one dump), so nothing records what vanished from a dump, and no
# tombstone can be served. "no" says exactly that - the source owns liveness,
# and a harvester must re-harvest to learn of a withdrawal. Claiming
# "persistent" while serving no deletions is the one thing a harvester can
# never detect. See AGENTS.md, "Deletions".
deletedRecord = "no"
description = "Zetcom MuseumPlus RIA XML, one record per moduleItem."

[basex]
url = "http://localhost:8080/rest"
user = "oai"
# DEV PLACEHOLDER. Prefer the OAI_BASEX_PASSWORD environment variable; this
# key exists only so the repo is runnable out of the box. Move it before
# anything is exposed.
password = "devpass"
timeout = 120

[datestamps]
# Source timestamps are local wall clock, space-separated, no zone
# ("2021-09-07 10:56:34.615"). They must be shifted to UTC, not merely labelled
# "Z", or incremental harvesting is silently wrong by the offset. Module mode
# reads each record's own __lastModified (see [[modules]]).
timezoneOffset = "+02:00"

[protocol]
pageSize = 100
# resumption tokens expire, which is what replaces server-side eviction
tokenTTL = 86400
# Indent the OAI envelope so it reads in a browser. Cosmetic: it never formats
# inside <metadata>, whose content is served verbatim, and an XML parser ignores
# the whitespace either way. Off by default; compact is the wire format.
prettyPrint = false
# DEV PLACEHOLDER. Prefer OAI_TOKEN_SECRET. Without a secret tokens are
# unsigned, so they cannot be trusted to be untampered - fine for local
# development, not for exposure.
tokenSecret = "dev-token-secret-change-me"

# Metadata formats to advertise. A format is one of:
#   passthrough - the stored payload is served verbatim inside <metadata>
#   derived     - assembled at serve time from the stored payload (oai_dc)
#   xslt        - produced by a stylesheet running inside BaseX (lido)
# An unknown `kind` is rejected at load time, not silently served as an
# empty <metadata>. Three formats are configured below.
[[metadata.formats]]
prefix = "ria"
namespace = "http://www.zetcom.com/ria/ws/module"
schema = ""
kind = "passthrough"

# Dublin Core, assembled at serve time from the stored payload. The payload is
# still stored and served verbatim for "ria"; this is a second view of it, not
# a second copy.
#
# Every prefix a term names is declared in `namespaces`, because a prefix in a
# query resolves against the query's own prolog - the stored payload has no
# namespaces to lend.
#
# **A term with no value is omitted, never emitted empty.** That is the whole
# of "correct Dublin Core" here: if the record has nothing for dc:date, there is
# no dc:date - rather than a blank one.
#
# **The whole Dublin Core mapping is in this one place.** Each term carries
# `module`, naming the module whose records it applies to, because the three
# modules are three different record shapes; a term with no `module` would apply
# to all of them. Nothing is invented: every term is either a field the record
# really has, or a literal declared as such (dc:language).
[[metadata.formats]]
prefix = "oai_dc"
namespace = "http://www.openarchives.org/OAI/2.0/oai_dc/"
schema = "http://www.openarchives.org/OAI/2.0/oai_dc.xsd"
kind = "derived"
wrapper = "oai_dc:dc"
namespaces = { oai_dc = "http://www.openarchives.org/OAI/2.0/oai_dc/", dc = "http://purl.org/dc/elements/1.1/" }

# ---- Object ---------------------------------------------------------------
# Grounded in what the 1000 real objects actually carry (coverage counted, not
# assumed): title 1000/1000, object number 1000/1000, main participant
# 1000/1000, technical term 999/1000, material/technique 998/1000, date virtual
# field 863/1000.
#
# The title is the museum's own display title, `ObjObjectTitleVrt`: present and
# non-empty on all 1000 objects, and equal to the `ObjObjectTitleGrp` item whose
# SortLnu is 1 in all 1000. The group's remaining items are variants
# ("Sammlungstitel", "Weiterer Titel", "Abweichender Titel", "Originaltitel"…)
# on 87 records; they are deliberately *not* mapped, because a harvester asking
# for dc:title wants the title, not the title history.
#
# **The test fixture has none of these fields** (it carries ObjObjectTitleClb,
# which the real export never has, and no ObjObjectTitleVrt at all), so a
# fixture-based test cannot see a title. That is why dc:title was missing here
# for so long - count coverage against the module databases, not the fixture.
[[metadata.formats.terms]]
module = "Object"
term = "dc:title"
xpath = "//virtualField[@name='ObjObjectTitleVrt']/value"

[[metadata.formats.terms]]
module = "Object"
term = "dc:identifier"
xpath = "//dataField[@name='ObjObjectNumberTxt']/value"

# The holding institution ("Verwaltende Institution"). Dublin Core has no
# institution element; dc:publisher - "an entity responsible for making the
# resource available" - is the slot harvesters (Europeana, the DDB) read as the
# data provider. Taken from the record's own owner reference (1000/1000,
# single-valued) rather than a constant, so it stays right if more than one
# collection is ever ingested.
[[metadata.formats.terms]]
module = "Object"
term = "dc:publisher"
xpath = "//moduleReference[@name='ObjOwnerRef']//formattedValue"

# the main person association, as the museum's own display form ("Opel, Peter")
[[metadata.formats.terms]]
module = "Object"
term = "dc:creator"
xpath = "//virtualField[@name='ObjPerAssociationMainParticipantNameVrt']/value"

# the object's own term, e.g. "Zeichnung"
[[metadata.formats.terms]]
module = "Object"
term = "dc:type"
xpath = "//dataField[@name='ObjTechnicalTermClb']/value"

# e.g. "1587" - the museum's formatted date, not a machine date
[[metadata.formats.terms]]
module = "Object"
term = "dc:date"
xpath = "//virtualField[@name='ObjDateVrt']/value"

# material and technique, e.g. "Feder in Braun, auf ... gezeichnet"
[[metadata.formats.terms]]
module = "Object"
term = "dc:format"
xpath = "//virtualField[@name='ObjMaterialTechniqueVrt']/value"

# subject keywords, from the classification the museum files the object under
[[metadata.formats.terms]]
module = "Object"
term = "dc:subject"
xpath = "//vocabularyReference[@name='ObjOrgGroupVoc']//formattedValue"

[[metadata.formats.terms]]
module = "Object"
term = "dc:subject"
xpath = "//vocabularyReference[@name='MaterialVoc']//formattedValue"

[[metadata.formats.terms]]
module = "Object"
term = "dc:subject"
xpath = "//vocabularyReference[@name='ObjCategoryVoc']//formattedValue"

# The collection is German; this is a declared constant, not a field.
[[metadata.formats.terms]]
module = "Object"
term = "dc:language"
literal = "de"

# ---- Person ---------------------------------------------------------------
# A Person record: the name is what names it, so the name is the title.
[[metadata.formats.terms]]
module = "Person"
term = "dc:title"
xpath = "//dataField[@name='PerNennformTxt']/value"

[[metadata.formats.terms]]
module = "Person"
term = "dc:subject"
xpath = "//vocabularyReference[@name='PerNationalityVoc']//formattedValue"

[[metadata.formats.terms]]
module = "Person"
term = "dc:description"
xpath = "//dataField[@name='PerNotesClb']/value"

[[metadata.formats.terms]]
module = "Person"
term = "dc:source"
xpath = "//dataField[@name='PerSourceClb']/value"

# The institution, as for Object - but a Person record carries no owner
# reference of its own, so this is a deployment constant, not data. See the note
# in AGENTS.md: it is the one value here that is an assumption about the
# deployment rather than something the record states.
[[metadata.formats.terms]]
module = "Person"
term = "dc:publisher"
literal = "Kupferstichkabinett, Staatliche Museen zu Berlin"

[[metadata.formats.terms]]
module = "Person"
term = "dc:language"
literal = "de"

# ---- Multimedia -----------------------------------------------------------
# A Multimedia record IS an asset, so the fields are the asset's own.
#
# Chosen by coverage across the 4232 real assets, not by the field's name:
# MulOriginalFileTxt 4168/4232, MulSubjectTxt 2186, MulDateTxt 1845,
# MulReferenceNumberTxt 1120, MulShootingDateDat 884, MulIPTCUrheberTxt 191,
# MulIPTCObjRefTxt 192, MulIPTCRightsTxt 172, MulTypeTxt 102. The fields that
# sound right but are nearly empty (MulPhotocreditTxt 33/4232,
# MulIPTCObjTitleTxt 103) are carried as extras, not as the main source.
[[metadata.formats.terms]]
module = "Multimedia"
term = "dc:title"
xpath = "//dataField[@name='MulOriginalFileTxt']/value"

[[metadata.formats.terms]]
module = "Multimedia"
term = "dc:title"
xpath = "//dataField[@name='MulIPTCObjTitleTxt']/value"

# the photographer / rights holder of the image
[[metadata.formats.terms]]
module = "Multimedia"
term = "dc:creator"
xpath = "//dataField[@name='MulIPTCUrheberTxt']/value"

[[metadata.formats.terms]]
module = "Multimedia"
term = "dc:identifier"
xpath = "//dataField[@name='MulReferenceNumberTxt']/value"

[[metadata.formats.terms]]
module = "Multimedia"
term = "dc:type"
xpath = "//dataField[@name='MulTypeTxt']/value"

[[metadata.formats.terms]]
module = "Multimedia"
term = "dc:date"
xpath = "//dataField[@name='MulDateTxt']/value"

[[metadata.formats.terms]]
module = "Multimedia"
term = "dc:date"
xpath = "//dataField[@name='MulShootingDateDat']/value"

[[metadata.formats.terms]]
module = "Multimedia"
term = "dc:description"
xpath = "//dataField[@name='MulSubjectTxt']/value"

[[metadata.formats.terms]]
module = "Multimedia"
term = "dc:rights"
xpath = "//dataField[@name='MulIPTCRightsTxt']/value"

[[metadata.formats.terms]]
module = "Multimedia"
term = "dc:source"
xpath = "//dataField[@name='MulPhotocreditTxt']/value"

# the object this asset documents
[[metadata.formats.terms]]
module = "Multimedia"
term = "dc:relation"
xpath = "//dataField[@name='MulIPTCObjRefTxt']/value"

# The institution, as a constant: an asset points at its object through
# MulObjectRef, but a term's xpath sees only its own record, so the owning
# collection cannot be joined in here.
[[metadata.formats.terms]]
module = "Multimedia"
term = "dc:publisher"
literal = "Kupferstichkabinett, Staatliche Museen zu Berlin"

[[metadata.formats.terms]]
module = "Multimedia"
term = "dc:language"
literal = "de"

# ---------------------------------------------------------------------------
# LIDO, from the XSLT that already exists (mokko/zml2lido, vendored under
# data/lido/). That stylesheet is **not a per-record mapping**: it reads a whole
# application/modules tree and reaches across modules - a person is a forward
# lookup from ObjPerAssociationRef, an asset is a *reverse* one (it points back
# at the object it documents), and related works point at other objects. So the
# provider rebuilds each record's world from the module databases, re-adds the
# RIA namespace the ingest stripped, and hands the whole thing to the transform.
#
# kind = "xslt" runs it inside BaseX (xslt:transform), so the record never
# leaves the store. It needs **Saxon on BaseX's classpath**; the app probes for
# that at startup and refuses to start without it, rather than failing on the
# first request that asks for LIDO.
#
# Two things this format cannot arrange for itself:
#   * `modules = ["Object"]` - LIDO is object-centric: one lido per object, with
#     persons and assets inlined. They are therefore not LIDO records, and
#     `ListRecords&metadataPrefix=lido` pages objects only.
#   * the stylesheet calls `document('file:vocmap.xml')` (and the fashion RDF).
#     A relative `file:` URI is scheme-absolute to the resolver, so it resolves
#     against **BaseX's working directory**, not the stylesheet's - which is why
#     zml2lido's own lidoTool.py does os.chdir(). BaseX must run with a cwd
#     containing vocmap.xml and europeanaFashion17.rdf or the first ISIL lookup
#     dies with FODC0002.
#
# NOTE - a policy deliberately left in the stylesheet for now: it drops objects
# without `ObjOwnerRef` and only emits `objectPublishedID` for records published
# at SMB-digital. Those are publishing decisions rather than structure, and
# could be lifted into config (a requires-xpath per format, or a set rule) so
# the provider decides what is publishable. Not done; this is the option.
[[metadata.formats]]
prefix = "lido"
namespace = "http://www.lido-schema.org"
schema = "http://www.lido-schema.org/schema/v1.0/lido-v1.0.xsd"
kind = "xslt"
stylesheet = "data/lido/zml2lido.xsl"
record = "lido:lido"
modules = ["Object"]
namespaces = { lido = "http://www.lido-schema.org" }

# ---------------------------------------------------------------------------
# One MuseumPlus module, one database - the colleague's `sync_<Type>` layout.
#
# This is what the ingest writes in module mode (`[[modules]]` present): the
# dump is split by module, each module's records are stored namespace-stripped
# under
#     application/modules/module[@name='<Name>']/moduleItem
# in its own database, so a query written for his setup reads identically:
#     collection('sync_Object')/application/modules/module[@name='Object']/moduleItem
#
# `identifierPrefix` is the module's tag in the OAI identifier. It is what
# makes the three modules' records distinct: the integer @id is unique only
# *within* a module (Object reaches 935894 while Person reaches 1764036 and
# Multimedia 8533256, so the ranges overlap and one id already appears as both
# an Object and a Multimedia record).
#
# `name` is the module name exactly as the dump spells it (module/@name).

[[modules]]
name = "Object"
database = "sync_Object"
identifierPrefix = "spk-berlin.de:object-"

# Sets for this module. "KK" is our internal label for the
# Kupferstichkabinett: the holder is the Address moduleItem the real data carries
# (1000/1000 objects in this chunk). The label is our own text, never lifted.
[[modules.sets]]
spec = "KK"
label = "Kupferstichkabinett, Staatliche Museen zu Berlin"
xpath = "moduleReference[@name='ObjOwnerRef']/moduleReferenceItem[@moduleItemId='112264']"

[[modules]]
name = "Person"
database = "sync_Person"
identifierPrefix = "spk-berlin.de:EM-person-"

[[modules]]
name = "Multimedia"
database = "sync_Multimedia"
identifierPrefix = "spk-berlin.de:EM-asset-"


